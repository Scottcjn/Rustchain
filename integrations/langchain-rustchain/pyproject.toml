[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-rustchain"
version = "0.2.0"
description = "Native LangChain BaseTool and Toolkit integration for the RustChain Proof-of-Antiquity network and bounty ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "RustChain Contributors"}
]
keywords = ["rustchain", "langchain", "ai-agents", "rtc", "proof-of-antiquity", "bounties"]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
