# Goes inside the rustchain.org `server { }` block on the settlement node.
    # Ledger state root (tools/ledger_snapshot.py, refreshed every 10 minutes).
    # The signed manifest is public so anyone can compare a replica's root with
    # this node's. Snapshot files are served only to known replicas.
    location = /state/manifest.json {
        alias /var/lib/rustchain-state/manifest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ ^/state/snapshots/(ledger-[0-9a-f]+-[0-9a-f]+\.db\.gz)$ {
        allow 50.28.86.153;      # node 2
        allow 129.213.90.66;     # oracle-rtc-elya
        deny all;
        alias /var/lib/rustchain-state/snapshots/$1;
        default_type application/octet-stream;
    }

