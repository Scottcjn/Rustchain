# FOLLOWER MODE (2026-10-01): node 1 holds the ledger of record; see the
# comment in sites-enabled/rustchain-dashboard. Port 8088 is the plain-HTTP
# door for old clients that cannot do TLS, so it redirects to node 1's own
# plain-HTTP legacy port instead of to https.
server {
    listen 8088;
    server_name _;

    location = /health {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /p2p/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 307 http://50.28.86.131:8088$request_uri;
    }
}
