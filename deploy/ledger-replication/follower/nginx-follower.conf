# Goes inside the default `server { }` block of a node that must not answer from its own ledger.
    # ============================================================
    # FOLLOWER MODE (2026-10-01)
    # Node 1 (50.28.86.131) holds the RustChain ledger of record. This
    # node's own database is a frozen copy of node 1 from 2026-03-08 and
    # must not answer ledger questions or accept ledger writes: it served
    # balances that disagreed with node 1 for months, and in September it
    # paid welcome bonuses to ~3,000 fake miners.
    #
    # Every RustChain route is answered with a 307 to node 1. A 307 keeps
    # the method and body, so miners and wallets that follow redirects keep
    # working against the real ledger, from their own IP address (node 1's
    # rate limits, hardware binding and sybil guard all key on it).
    #
    # Served locally: /health and /ready (is THIS node's process up?) and
    # /p2p/ (node-to-node gossip, authenticated inside the app).
    #
    # The trusted-caller blocks that used to sit here (/agent/, /admin/,
    # /ops/, /gov/, /rewards/, /pending/, /wallet/transfer, /wallet/ledger,
    # /wallet/balances/all, /miner/headerkey) were removed on purpose: they
    # let allowlisted IPs act on this node's stale ledger. Those paths now
    # fall through to the redirect, and node 1 applies its own allowlist.
    # ============================================================

    location = /health {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /p2p/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 307 https://50.28.86.131$request_uri;
    }
