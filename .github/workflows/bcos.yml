name: BCOS v2 Verification

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  bcos-scan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run BCOS Action
        uses: tedTorus/bcos-action@main
        with:
          tier: 'L1'
          github-token: ${{ secrets.GITHUB_TOKEN }}
