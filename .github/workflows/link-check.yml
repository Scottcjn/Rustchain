name: Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in README and docs
        run: |
          sudo apt-get update
          sudo apt-get install -y lychee
          lychee --verbose --no-progress --include-robots-txt README.md docs/
