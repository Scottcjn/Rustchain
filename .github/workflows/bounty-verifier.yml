name: Bounty Verifier

# Verifies bounty claims on issues tagged with the `bounty` label, including
# the FTC-compliant "share why you starred" engagement bounties (e.g. #165).
# Runs the rtc-auto-bounty composite action to validate each claim and report
# verdicts back on the issue.

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  verify-bounty:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'bounty')) ||
      (github.event_name == 'issues' && github.event.label.name == 'bounty')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests for the verifier
        working-directory: .github/actions/rtc-auto-bounty
        run: python3 -m pytest test_award_rtc.py -v

      - name: Verify claims and post verdicts
        uses: ./.github/actions/rtc-auto-bounty
        with:
          issue_number: ${{ github.event.issue.number }}
          pool: '300'
          per_claim: '3'
          kind: 'engagement'
          github_token: ${{ secrets.GITHUB_TOKEN }}
