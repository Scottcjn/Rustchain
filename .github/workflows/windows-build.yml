name: Windows Build

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    strategy:
      matrix:
        os: [windows-latest]
        target: [x86_64-pc-windows-msvc]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Windows SDK dependencies
        shell: pwsh
        run: |
          # Ensure Visual C++ Build Tools are available
          choco install -y vcredist140 --no-progress
          # Install Git for Windows if not present
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            choco install -y git --no-progress
          }

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --release --target ${{ matrix.target }}

      - name: Package release artifacts
        shell: pwsh
        run: |
          $outDir = "dist/windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $binName = (Get-ChildItem "target/${{ matrix.target }}/release/*.exe" | Select-Object -First 1).Name
          Copy-Item "target/${{ matrix.target }}/release/$binName" "$outDir/$binName"
          # Include .env examples for easy setup
          Copy-Item ".env.example" "$outDir/.env.example"
          Copy-Item ".env.miner.example" "$outDir/.env.miner.example"
          # Create a setup script for Windows users
          $setupScript = @"
          # RustChain Windows Setup Script
          # Run this script from the directory containing the RustChain binary

          Write-Host "=== RustChain Windows Setup ===" -ForegroundColor Cyan

          # Check for required environment variables
          if (-not (Test-Path ".env")) {
              Write-Host "Creating .env from template..." -ForegroundColor Yellow
              Copy-Item ".env.example" ".env"
              Write-Host "Please edit .env with your configuration." -ForegroundColor Yellow
          }

          if (-not (Test-Path ".env.miner")) {
              Write-Host "Creating .env.miner from template..." -ForegroundColor Yellow
              Copy-Item ".env.miner.example" ".env.miner"
              Write-Host "Please edit .env.miner with your mining configuration." -ForegroundColor Yellow
          }

          # Verify the binary is executable
          $bin = Get-ChildItem "*.exe" | Select-Object -First 1
          if ($bin) {
              Write-Host "Found binary: $($bin.Name)" -ForegroundColor Green
              & "$($bin.Name)" --version
          } else {
              Write-Host "ERROR: No .exe binary found in current directory." -ForegroundColor Red
              exit 1
          }

          Write-Host ""
          Write-Host "Setup complete! Run the binary to start RustChain." -ForegroundColor Green
          Write-Host "  .\`$binName --help" -ForegroundColor White
          "@
          $setupScript | Set-Content -Path "$outDir/setup.ps1" -Encoding UTF8
          Write-Host "Packaged artifacts:"
          Get-ChildItem $outDir | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustchain-windows-${{ matrix.target }}
          path: dist/windows/
          retention-days: 30

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arm64-

      - name: Build (release, ARM64)
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Package ARM64 artifacts
        shell: pwsh
        run: |
          $outDir = "dist/windows-arm64"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $binName = (Get-ChildItem "target/aarch64-pc-windows-msvc/release/*.exe" | Select-Object -First 1).Name
          Copy-Item "target/aarch64-pc-windows-msvc/release/$binName" "$outDir/$binName"
          Copy-Item ".env.example" "$outDir/.env.example"
          Copy-Item ".env.miner.example" "$outDir/.env.miner.example"

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustchain-windows-arm64
          path: dist/windows-arm64/
          retention-days: 30
