name: Python SDK CLI Tests

on:
  push:
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk-cli-tests.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk-cli-tests.yml"

jobs:
  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "./sdk/python[dev]"
      - name: Run Click CliRunner suite
        run: pytest sdk/python/tests/test_cli.py sdk/python/rustchain_sdk/tests/test_amounts.py -v
