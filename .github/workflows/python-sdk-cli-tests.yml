name: Python SDK CLI Tests

on:
  push:
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk-cli-tests.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk-cli-tests.yml"

jobs:
  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest click aiohttp cryptography mnemonic
      - name: Run Click CliRunner suite
        run: pytest sdk/python/tests/test_cli.py -v
