name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      timeout-minutes: 2

    - name: Set up Python
      uses: actions/setup-python@v5
      timeout-minutes: 2
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      timeout-minutes: 4
      run: |
        python -m pip install --upgrade --timeout 60 --retries 3 pip
        pip install --timeout 60 --retries 3 ruff mypy pytest pytest-mock bandit flask beacon-skill "openapi-spec-validator>=0.7,<0.8"
        if [ -f requirements.txt ]; then pip install --timeout 60 --retries 3 -r requirements.txt; fi
        if [ -f tests/requirements.txt ]; then pip install --timeout 60 --retries 3 -r tests/requirements.txt; fi

    - name: Lint (syntax + runtime safety subset)
      timeout-minutes: 2
      run: ruff check tests --select E9,F63,F7,F82

    - name: Type check (core test crypto shim)
      timeout-minutes: 2
      run: mypy tests/mock_crypto.py --ignore-missing-imports

    - name: Security scan (tests)
      timeout-minutes: 2
      run: bandit -r tests --severity-level medium --confidence-level high -c pyproject.toml

    - name: Read-only API contract and docs gate
      timeout-minutes: 2
      run: python -m compatibility_lab ci

    - name: Installed compatibility CLI smoke test
      timeout-minutes: 3
      run: |
        python -m pip wheel --no-deps --wheel-dir /tmp/rustchain-wheel .
        python -m venv /tmp/rustchain-compat-venv
        /tmp/rustchain-compat-venv/bin/pip install --timeout 60 --retries 3 --force-reinstall /tmp/rustchain-wheel/rustchain-*.whl
        cd /tmp
        /tmp/rustchain-compat-venv/bin/rustchain-compat validate

    - name: Attestation fuzz regression gate
      timeout-minutes: 3
      env:
        RC_ADMIN_KEY: "0123456789abcdef0123456789abcdef"
        RC_P2P_SECRET: "ci-test-secret-00000000000000000000000000000000"
        DB_PATH: ":memory:"
        ATTEST_FUZZ_CASES: "10000"
      run: python -m pytest tests/test_attestation_fuzz.py -k mutation_regression_no_unhandled_exceptions -v

    - name: Verify relative documentation links
      timeout-minutes: 2
      run: python tools/check_relative_links.py

    - name: Run tests with pytest (blocking)
      timeout-minutes: 5
      env:
        RC_ADMIN_KEY: "0123456789abcdef0123456789abcdef"
        RC_P2P_SECRET: "ci-test-secret-00000000000000000000000000000000"
        DB_PATH: ":memory:"
      run: pytest tests/ -v --ignore=tests/test_epoch_settlement_formal.py --ignore=tests/test_rip201_bucket_spoof.py

  ci-timeout-diagnostic:
    name: CI Status & Timeout Distinguisher
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Classify CI outcome (timeout/infra stall vs code failure)
        timeout-minutes: 1
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" = "cancelled" ]; then
            echo "::warning title=CI Runner or Step Timeout::Job was cancelled due to a runner acquisition stall or step timeout (not a contributor test assertion failure). Re-run the workflow if caused by transient GitHub Actions/PyPI infrastructure degradation."
            {
              echo "### ⚠️ CI Timed Out / Cancelled (Infrastructure or Step Timeout)"
              echo 'The `test` job ended with status **`cancelled`** (timed out after its configured `timeout-minutes` cap or runner acquisition timeout).'
              echo "- **This is NOT a contributor code/test failure.**"
              echo '- Check whether a network fetch (`pip install`), action download, or hosted runner queue stalled.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$TEST_RESULT" = "failure" ]; then
            echo "::error title=Contributor Code or Test Failure::A lint, type-check, security, link-check, or pytest step exited with a non-zero status code."
            {
              echo "### ❌ CI Failed (Code / Test Assertion Failure)"
              echo 'The `test` job completed execution and reported a genuine **`failure`** in one of the verification steps.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "### ✅ CI Passed ($TEST_RESULT)" >> "$GITHUB_STEP_SUMMARY"
          fi
