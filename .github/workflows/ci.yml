name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pytest pytest-mock bandit flask beacon-skill "openapi-spec-validator>=0.7,<0.8"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi

    - name: Lint (syntax + runtime safety subset)
      run: ruff check tests --select E9,F63,F7,F82

    - name: Type check (core test crypto shim)
      run: mypy tests/mock_crypto.py --ignore-missing-imports

    - name: Security scan (tests)
      run: bandit -r tests --severity-level medium --confidence-level high -c pyproject.toml

    - name: Read-only API contract and docs gate
      run: python -m compatibility_lab ci

    - name: Installed compatibility CLI smoke test
      run: |
        python -m pip wheel --no-deps --wheel-dir /tmp/rustchain-wheel .
        python -m venv /tmp/rustchain-compat-venv
        /tmp/rustchain-compat-venv/bin/pip install --force-reinstall /tmp/rustchain-wheel/rustchain-*.whl
        cd /tmp
        /tmp/rustchain-compat-venv/bin/rustchain-compat validate

    - name: Attestation fuzz regression gate
      env:
        RC_ADMIN_KEY: "0123456789abcdef0123456789abcdef"
        RC_P2P_SECRET: "ci-test-secret-00000000000000000000000000000000"
        DB_PATH: ":memory:"
        ATTEST_FUZZ_CASES: "10000"
      run: python -m pytest tests/test_attestation_fuzz.py -k mutation_regression_no_unhandled_exceptions -v

    - name: Verify relative documentation links
      run: python tools/check_relative_links.py

    - name: Run tests with pytest (blocking)
      env:
        RC_ADMIN_KEY: "0123456789abcdef0123456789abcdef"
        RC_P2P_SECRET: "ci-test-secret-00000000000000000000000000000000"
        DB_PATH: ":memory:"
      run: pytest tests/ -v --ignore=tests/test_epoch_settlement_formal.py --ignore=tests/test_rip201_bucket_spoof.py

    - name: Monitor probe tests (bounty #17180)
      run: |
        pip install -q prometheus_client requests -r monitoring/alerts/requirements.txt
        # tests/test_settlement_lag_visibility.py is deliberately not in
        # this list: its NodeHelperTest setup errors on clean upstream main
        # too (duplicate prometheus registration when the node module
        # loads), so it would turn this step red for a pre-existing reason.
        python -m pytest status/test_status.py monitoring/test_node_probe.py monitoring/test_impostor_across_monitors.py health-dashboard/test_health_dashboard.py tools/node-health-cli/tests/test_node_health.py tests/test_health_monitor.py tests/test_node_liveness_requires_node_state.py tools/test_node_health_total_miners.py -v
        # Alerts tests run separately: monitoring/alerts/tests/ and tests/
        # share basenames (test_api.py, ...), so pytest cannot collect both
        # directories in one invocation (import file mismatch). Pre-existing
        # repo layout quirk, unrelated to this change.
        python -m pytest monitoring/alerts/tests/ -v
