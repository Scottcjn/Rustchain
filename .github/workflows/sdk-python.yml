name: sdk-python

# Runs the offline CLI test suite (sdk/python/tests/) on changes to the SDK.
# All HTTP traffic in the tests is mocked with respx — this job needs no
# network access to a live node.

on:
  push:
    branches: [main, master]
    paths:
      - "sdk/python/**"
      - ".github/workflows/sdk-python.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - ".github/workflows/sdk-python.yml"

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e sdk/python -r sdk/python/requirements-dev.txt
      - run: python -m pytest sdk/python/tests/test_cli.py -v
