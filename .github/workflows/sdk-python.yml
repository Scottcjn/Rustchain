name: SDK Python Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'sdk/python/**'
      - '.github/workflows/sdk-python.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdk/python/**'
      - '.github/workflows/sdk-python.yml'

jobs:
  sdk-python-cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python -r sdk/python/requirements-dev.txt

      - name: Run Python SDK CLI test suite (offline, mocked with respx)
        run: |
          python -m pytest sdk/python/tests/test_cli.py -v
