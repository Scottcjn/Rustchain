name: Auto Label PRs

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply PR labels
        uses: actions/labeler@v5
        timeout-minutes: 3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
