name: Stale Issue & PR Cleanup

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # actions/stale has no title-based exemption (only label/milestone/
      # assignee/draft inputs), so label security-titled PRs first; the
      # `security` label below then keeps stale off them.
      - name: Label PRs with "security" in the title
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create security --color B60205 \
            --description "Security-relevant; exempt from stale" 2>/dev/null || true
          gh pr list --state open --search "security in:title" --limit 300 \
            --json number --jq '.[].number' \
          | while read -r n; do
              gh pr edit "$n" --add-label security || echo "could not label #$n"
            done
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            This issue has been inactive for 45 days. It will be marked as stale.
            If this is still relevant, please comment to keep it open.
          stale-pr-message: |
            This PR has been inactive for 21 days. It will be closed in 14 days unless updated.
            Need help finishing? Ask in the PR comments — we're happy to assist!
          close-pr-message: 'Closed due to inactivity. Feel free to reopen with updates.'
          days-before-stale: 45
          days-before-close: -1
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'bounty,security,needs-review,pinned,critical,consensus,tracking,operations'
          exempt-pr-labels: 'security,needs-review,critical,WIP'
          exempt-draft-pr: true
          operations-per-run: 300
