name: Link Check

on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'tools/check_relative_links.py'
      - '.github/workflows/lychee.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.11'

      - name: Enforce relative links (blocking gate)
        timeout-minutes: 3
        run: python tools/check_relative_links.py

      - name: Check external and fragment links (lychee)
        uses: lycheeverse/lychee-action@v2
        timeout-minutes: 5
        with:
          fail: false   # external URLs are informational; relative links are strictly enforced above
          args: >
            --verbose
            --no-progress
            --include-fragments
            --exclude-all-private
            --exclude "https?://(twitter|x)\.com"
            --exclude "https://github.com/Scottcjn/Rustchain/actions"
            --exclude "https?://(www\.)?(linkedin|facebook|instagram|tiktok)"
            --exclude "https?://(127\.0\.0\.1|localhost)(:\d+)?"
            --exclude "https?://50\.28\.86\.131(:\d+)?"
            --exclude "https?://img\.shields\.io"
            --exclude "https?://openreview\.net"
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            -- './**/*.md' './**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
