name: Link Check

on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --include-fragments
            --exclude-all-private
            --exclude "https?://(twitter|x)\\.com"
            --exclude "https://github.com/Scottcjn/Rustchain/actions"
            --exclude "https://github.com/waterWang/Rustchain/actions"
            --exclude "https?://(www\\.)?(linkedin|facebook|instagram|tiktok|youtube)\\.com"
            --exclude "https://dexscreener\\.com"
            --exclude "https://github\\.com/Scottcjn/Rustchain/stargazers"
            --exclude "https://img\\.shields\\.io"
            --exclude "https://rustchain\\.org/bcos"
            --exclude "https://rustchain\\.org/green"
            --exclude "https://rustchain\\.org/install"
            --exclude "https://rustchain\\.org/machines"
            --exclude "https://rustchain\\.org/manifesto"
            --exclude "https://rustchain\\.org/principles"
            --exclude "https://rustchain\\.org/whitepaper"
            --exclude "https://rustchain\\.org/api-zh"
            --exclude "https://rustchain\\.org/beginner"
            --exclude "https://rustchain\\.org/docs"
            --exclude "https://rustchain\\.org/claims"
            --exclude "https://rustchain\\.org/fossils"
            --exclude "https://rustchain\\.org/light-client"
            --exclude "https://rustchain\\.org/museum"
            --exclude "https://linearb\\.io"
            --exclude "https?://50\\.28\\.86\\.1[0-9][0-9]"
            --exclude "https://scottcjn\\.github\\.io/elyan-labs-site"
            --exclude "https://github\\.com/Scottcjn/rustchain-bounties"
            --exclude "https://www\\.qanplatform\\.com"
            --exclude "https://basescan\\.org"
            --exclude "https://sepolia\\.basescan\\.org"
            --exclude "http://your-server"
            --exclude-path "explorer/"
            --exclude-path "web/"
            --exclude-path "website/"
            --exclude-path "otc-bridge/static/"
            --exclude-path "passport/templates/"
            --exclude-path "status/templates/"
            --exclude-path "tools/"
            --exclude-path "assets/"
            -- './**/*.md' './**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail on broken relative links
        if: failure()
        run: exit 1