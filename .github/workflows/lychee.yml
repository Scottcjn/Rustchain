name: Link Check

on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Blocking and deterministic: this step never touches the network, so
      # every relative link and #fragment in README.md and the top-level docs
      # must resolve to a file/anchor that actually exists, or the job fails.
      - name: Enforce relative links (README + top-level docs)
        run: python3 scripts/check_links.py *.md

      # Informational only: external URLs can be flaky or rate-limited, so we
      # report them in the job summary without blocking CI.
      - name: Check all links incl. external URLs (informational)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false   # report broken links in the job summary but do not block CI (whole-repo doc check)
          args: >
            --verbose
            --no-progress
            --include-fragments
            --exclude-all-private
            --exclude "https?://(twitter|x)\.com"
            --exclude "https://github.com/Scottcjn/Rustchain/actions"
            --exclude "https?://(www\.)?(linkedin|facebook|instagram|tiktok)"
            --exclude "https?://(127\.0\.0\.1|localhost)(:\d+)?"
            --exclude "https?://50\.28\.86\.131(:\d+)?"
            --exclude "https://rustchain.org/faq"
            --exclude "https?://img\.shields\.io"
            --exclude "https?://(www\.)?raydium\.io"
            --exclude "https?://openreview\.net"
            --exclude "https?://dexscreener\.com"
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            -- './**/*.md' './**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
