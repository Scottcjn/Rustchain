name: Link Check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative and external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --include-fragments
            --exclude-all-private
            --exclude "https?://(twitter|x)\\.com"
            --exclude "https://github.com/Scottcjn/Rustchain/actions"
            --exclude "https?://(www\\.)?(linkedin|facebook|instagram|tiktok)"
            --exclude "https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?"
            --exclude-mail
            -- './**/*.md' './**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on broken links
        if: failure()
        run: |
          echo "::error::Broken links found. Check the lychee output above for details."
          exit 1
