name: "Bounty Claim"
description: "Claim a RustChain bounty. For 'share why you starred' bounties, all three FTC disclosure fields are required."
title: "[Bounty Claim] "
labels: ["bounty", "claim"]
assignees: []
body:
  - type: "markdown"
    attributes:
      value: |
        ## Claiming a RustChain bounty

        A **star alone does not qualify.** Per FTC 16 CFR §465.5 / §255.5,
        you must disclose compensation and show genuine engagement. Fill in
        every field below — the automated verifier will reject incomplete
        claims.

  - type: "input"
    id: issue
    attributes:
      label: "Bounty issue number"
      description: "e.g. 165"
      placeholder: "165"
    validations:
      required: true

  - type: "input"
    id: post_url
    attributes:
      label: "Link to your public post"
      description: "X/Twitter, Reddit, Mastodon, Dev.to, HN, blog, etc. Must be public and still live."
      placeholder: "https://x.com/you/status/..."
    validations:
      required: true

  - type: "input"
    id: reviewed
    attributes:
      label: "What you reviewed (link)"
      description: "At least one file, PR, feature, or doc section you actually looked at. Link it."
      placeholder: "https://github.com/Scottcjn/Rustchain/blob/main/src/miner/oscillator_drift.rs"
    validations:
      required: true

  - type: "textarea"
    id: reason
    attributes:
      label: "Why you liked it"
      description: "A specific, non-generic reason. 'Great project' does not qualify."
      placeholder: "The oscillator-drift fingerprinting is a genuinely novel way to reward vintage hardware instead of burning energy on SHA-256."
    validations:
      required: true

  - type: "input"
    id: wallet
    attributes:
      label: "RTC wallet address"
      description: "Leave blank and we'll create one for you."
      placeholder: "RTC1..."
    validations:
      required: false

  - type: "markdown"
    attributes:
      value: |
        **Disclosure (required, copy verbatim):**

        > I received RTC compensation for this post.

  - type: "checkbox"
    id: disclosure
    attributes:
      label: "I confirm I included the disclosure line 'I received RTC compensa...' in my post/comment."
    validations:
      required: true

  - type: "checkbox"
    id: account_age
    attributes:
      label: "My account is older than 30 days with prior activity (not a fresh farming account)."
    validations:
      required: true

  - type: "checkbox"
    id: no_fake
    attributes:
      label: "I did not buy likes/retweets or otherwise fake engagement."
    validations:
      required: true
