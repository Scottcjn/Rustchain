# SPDX-License-Identifier: MIT
name: "BCOS v2 — Beacon Certified Open Source Scan (Subdirectory Action)"
description: "Composite GitHub Action wrapper for tools/bcos_action_runner.py"
author: "RustChain / Beacon Certified Open Source"

inputs:
  tier:
    description: "Target BCOS certification tier (L0, L1, or L2)"
    required: false
    default: "L1"
  reviewer:
    description: "Reviewer GitHub handle or identifier"
    required: false
    default: ""
  repo-path:
    description: "Path to the repository to scan"
    required: false
    default: "."
  node-url:
    description: "RustChain node base URL"
    required: false
    default: "https://rustchain.org"
  signing-key-hex:
    description: "Optional Ed25519 signing seed hex"
    required: false
    default: ""
  admin-key:
    description: "Optional X-Admin-Key for /bcos/attest"
    required: false
    default: ""
  github-token:
    description: "GitHub token for PR comment posting"
    required: false
    default: ""
  post-pr-comment:
    description: "Whether to post a PR comment on pull_request events"
    required: false
    default: "true"
  attest-on-merge:
    description: "Whether to submit attestation to /bcos/attest on push/merge"
    required: false
    default: "true"
  fail-on-tier-unmet:
    description: "Whether to fail the step if tier_met is false"
    required: false
    default: "false"
  output-file:
    description: "Output path for bcos-report.json"
    required: false
    default: "bcos-report.json"

outputs:
  trust_score:
    description: "Computed BCOS trust score (0-100)"
    value: ${{ steps.bcos_scan.outputs.trust_score }}
  cert_id:
    description: "Deterministic BCOS certificate ID (BCOS-xxxxxxxx)"
    value: ${{ steps.bcos_scan.outputs.cert_id }}
  tier_met:
    description: "Whether the repository met the target BCOS tier threshold (true/false)"
    value: ${{ steps.bcos_scan.outputs.tier_met }}
  commitment:
    description: "BLAKE2b-256 hex commitment of the canonical BCOS v2 report"
    value: ${{ steps.bcos_scan.outputs.commitment }}
  badge_url:
    description: "Public SVG badge URL"
    value: ${{ steps.bcos_scan.outputs.badge_url }}
  verify_url:
    description: "Public verification URL"
    value: ${{ steps.bcos_scan.outputs.verify_url }}

runs:
  using: "composite"
  steps:
    - name: Run BCOS v2 Action Runner
      id: bcos_scan
      shell: bash
      env:
        BCOS_TIER: ${{ inputs.tier }}
        BCOS_REVIEWER: ${{ inputs.reviewer }}
        BCOS_REPO_PATH: ${{ inputs.repo-path }}
        BCOS_NODE_URL: ${{ inputs.node-url }}
        BCOS_SIGNING_KEY_HEX: ${{ inputs.signing-key-hex }}
        BCOS_ADMIN_KEY: ${{ inputs.admin-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BCOS_POST_PR_COMMENT: ${{ inputs.post-pr-comment }}
        BCOS_ATTEST_ON_MERGE: ${{ inputs.attest-on-merge }}
        BCOS_FAIL_ON_TIER_UNMET: ${{ inputs.fail-on-tier-unmet }}
        BCOS_OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        python3 "${{ github.action_path }}/../../../tools/bcos_action_runner.py" \
          --path "${BCOS_REPO_PATH}" \
          --tier "${BCOS_TIER}" \
          --reviewer "${BCOS_REVIEWER}" \
          --node-url "${BCOS_NODE_URL}" \
          --output "${BCOS_OUTPUT_FILE}"
