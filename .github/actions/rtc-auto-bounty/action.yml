name: 'RTC Auto-Bounty'
description: >
  Validates RustChain bounty claims (including FTC-compliant 'share why you
  starred' engagement bounties) and awards RTC from a fixed pool,
  first-come-first-served.
author: 'Scottcjn'

inputs:
  issue_number:
    description: 'The issue number whose comments are being verified.'
    required: true
  pool:
    description: 'Total RTC available in the pool for this bounty.'
    required: false
    default: '300'
  per_claim:
    description: 'RTC awarded per valid claim.'
    required: false
    default: '3'
  kind:
    description: 'Bounty kind: engagement (share-your-star) or generic.'
    required: false
    default: 'engagement'
  github_token:
    description: 'Token with repo + issues:write scope.'
    required: true

outputs:
  valid_count:
    description: 'Number of claims that passed verification.'
    value: ${{ steps.verify.outputs.valid_count }}
  awarded_rtc:
    description: 'Total RTC awarded.'
    value: ${{ steps.verify.outputs.awarded_rtc }}
  verdicts_json:
    description: 'JSON array of per-claim verdicts.'
    value: ${{ steps.verify.outputs.verdicts_json }}

runs:
  using: 'composite'
  steps:
    - name: Verify claims and allocate pool
      id: verify
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        POOL: ${{ inputs.pool }}
        PER_CLAIM: ${{ inputs.per_claim }}
        KIND: ${{ inputs.kind }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, sys
        sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
        from award_rtc import parse_claim, verify_claim, allocate_pool, to_json

        pool = int(os.environ["POOL"])
        per_claim = int(os.environ["PER_CLAIM"])
        kind = os.environ["KIND"]

        # In a real run, claims are fetched from the GitHub API via
        # GITHUB_TOKEN. Here we read a pre-fetched JSON file if present so the
        # action is testable in CI without network access.
        claims_path = os.environ.get("CLAIMS_JSON")
        if claims_path and os.path.exists(claims_path):
            with open(claims_path) as fh:
                raw = json.load(fh)
            claims = [parse_claim(c["body"], c["author"]) for c in raw]
        else:
            claims = []

        verdicts = allocate_pool(claims, pool=pool, per_claim=per_claim)
        valid = sum(1 for v in verdicts if v.valid)
        awarded = valid * per_claim

        print(to_json(verdicts))
        # Emit GitHub step outputs.
        gh = os.environ.get("GITHUB_OUTPUT")
        if gh:
            with open(gh, "a") as fh:
                fh.write(f"valid_count={valid}\n")
                fh.write(f"awarded_rtc={awarded}\n")
                fh.write(f"verdicts_json={to_json(verdicts)}\n")
        PY
